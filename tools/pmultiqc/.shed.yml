name: pmultiqc
owner: galaxyp
description: PMultiQC aggregates proteomics QC results from multiple pipelines into a single interactive report
homepage_url: https://github.com/bigbio/pmultiqc
long_description: |
  PMultiQC is a MultiQC plugin for comprehensive quality control reporting of mass spectrometry-based
  proteomics data. It generates interactive HTML reports with QC metrics and visualizations for results
  of the quantms pipeline, MaxQuant, mzIdentML, FragPipe, nf-core/mhcquant and QPX.
remote_repository_url: https://github.com/galaxyproteomics/tools-galaxyp/tree/master/tools/pmultiqc
type: unrestricted
categories:
- Proteomics
- Visualization

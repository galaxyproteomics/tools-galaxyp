name: eggsplorer
owner: galaxyp
description: Eggsplorer - interactive HTML report of eggNOG-mapper functional annotations
long_description: |
  Builds a self-contained HTML report from eggNOG-mapper annotations: annotation coverage,
  taxonomic level of annotation transfer, COG categories, most frequent GO terms, a cell
  overview, metabolic function completeness (KEGG-Decoder definitions, corrected), nitrogen,
  sulfur and carbon cycle diagrams, TC transporters, EC classes with ENZYME names, CAZy
  families and substrates (dbCAN-sub), Pfam domains and a searchable gene table.
  Optional KofamScan input adds a second, HMM-based source of KO assignments. No KEGG data
  is bundled and no network access is needed.
remote_repository_url: https://github.com/galaxyproteomics/tools-galaxyp/tree/master/tools/eggsplorer
homepage_url: https://github.com/vebaev/eggsplorer
type: unrestricted
categories:
  - Visualization
  - Genome annotation
  - Metagenomics

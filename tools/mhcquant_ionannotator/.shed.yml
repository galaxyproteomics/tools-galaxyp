categories:
- Proteomics
description: Annotate DDA MS2 spectra with theoretical fragment ions of FDR-filtered peptides (mhcquant ion annotator)
long_description: |
  This tool wraps get_ion_annotations.py, a helper script shipped with the
  nf-core/mhcquant pipeline. It annotates the peaks of the MS2 spectra
  referenced by an FDR-filtered idXML with theoretical fragment ions (b/y by
  default, a/c/x/z optional) of the assigned peptide sequences. The two
  tabular outputs (all peaks and matching ions) aid the manual validation of
  peptide-spectrum matches in immunopeptidomics workflows such as MHC ligand
  identification.
homepage_url: https://github.com/nf-core/mhcquant
